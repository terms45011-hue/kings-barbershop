<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kings Barber Co — Admin Dashboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,600;0,700;1,400&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #050505; --bg-card: #0d0d0d; --bg-input: #1a1a1a;
      --gold: #c8a44e; --gold-d: #8a6e2c; --white: #f5f5f5; 
      --text: #e8e8e8; --text-m: #777; --text-d: #3a3a3a;
      --border: rgba(200,164,78,0.15);
      --green: #22c55e; --red: #ef4444;
      --font-h: 'Playfair Display', Georgia, serif; --font-b: 'Inter', system-ui, sans-serif;
      --tr: all 0.3s ease;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { background: var(--bg); color: var(--text); font-family: var(--font-b); line-height: 1.6; min-height: 100vh; }
    button { cursor: pointer; border: none; background: none; font-family: inherit; }
    input, textarea, select { font-family: inherit; }
    
    .login-overlay { position: fixed; inset: 0; background: var(--bg); display: flex; align-items: center; justify-content: center; z-index: 1000; }
    .login-box { background: var(--bg-card); border: 1px solid var(--border); padding: 3rem; width: 100%; max-width: 400px; text-align: center; }
    .login-title { font-family: var(--font-h); font-size: 1.5rem; color: var(--gold); margin-bottom: 1.5rem; letter-spacing: 0.1em; }
    .login-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 1rem; color: var(--text); margin-bottom: 1rem; text-align: center; letter-spacing: 0.2em; }
    .login-input:focus { border-color: var(--gold); outline: none; }
    .btn { background: var(--gold); color: var(--bg); padding: 0.875rem 2rem; font-weight: 600; letter-spacing: 0.1em; text-transform: uppercase; font-size: 0.8rem; transition: var(--tr); width: 100%; display: inline-block; text-align: center; cursor: pointer; border: none; font-family: inherit; }
    .btn:hover { background: #e8c86e; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { border-color: var(--gold); color: var(--gold); }
    .btn-sm { padding: 0.4rem 1rem; font-size: 0.7rem; }
    .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .btn-danger:hover { background: var(--red); color: white; }

    .app { display: none; min-height: 100vh; flex-direction: column; }
    .app.active { display: flex; }
    
    .header { background: var(--bg-card); border-bottom: 1px solid var(--border); padding: 1.5rem 2rem; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem; }
    .brand { font-family: var(--font-h); font-size: 1.25rem; color: var(--gold); letter-spacing: 0.1em; }
    .nav-tabs { display: flex; gap: 1rem; align-items: center; }
    .tab { color: var(--text-m); padding: 0.5rem 1rem; font-size: 0.85rem; font-weight: 500; text-transform: uppercase; letter-spacing: 0.05em; border-bottom: 2px solid transparent; transition: var(--tr); cursor: pointer; }
    .tab:hover { color: var(--text); }
    .tab.active { color: var(--gold); border-bottom-color: var(--gold); }

    /* Realtime indicator */
    .rt-indicator {
      display: flex; align-items: center; gap: 0.5rem; font-size: 0.7rem;
      color: var(--text-m); letter-spacing: 0.08em; text-transform: uppercase;
    }
    .rt-dot {
      width: 8px; height: 8px; border-radius: 50%; background: var(--text-d);
      transition: var(--tr);
    }
    .rt-dot.live { background: var(--green); box-shadow: 0 0 8px rgba(34,197,94,0.6); animation: pulse-dot 2s infinite; }
    @keyframes pulse-dot { 0%,100%{opacity:1} 50%{opacity:0.4} }

    .main { flex: 1; padding: 3rem 2rem; max-width: 1200px; margin: 0 auto; width: 100%; }
    .section { display: none; animation: fadeIn 0.3s ease; }
    .section.active { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    
    .sec-title { font-family: var(--font-h); font-size: 2rem; margin-bottom: 2rem; color: var(--white); }
    
    /* Stats */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.5rem; margin-bottom: 3rem; }
    .stat-card { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; text-align: center; transition: var(--tr); }
    .stat-card:hover { border-color: rgba(200,164,78,0.4); }
    .stat-val { font-family: var(--font-h); font-size: 2.5rem; color: var(--gold); margin-bottom: 0.5rem; line-height: 1; }
    .stat-lbl { font-size: 0.75rem; color: var(--text-m); text-transform: uppercase; letter-spacing: 0.1em; }

    /* Bookings List */
    .date-group { margin-bottom: 2.5rem; }
    .date-hdr { font-family: var(--font-h); font-size: 1.25rem; color: var(--gold); border-bottom: 1px solid var(--border); padding-bottom: 0.5rem; margin-bottom: 1rem; display: flex; align-items: center; gap: 0.75rem; }
    .b-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 1rem; }
    .b-card { background: var(--bg-card); border: 1px solid var(--border); padding: 1.5rem; position: relative; transition: var(--tr); }
    .b-card:hover { border-color: var(--gold); }
    .b-card.new-booking { animation: cardPop 0.5s ease; border-color: var(--green); }
    @keyframes cardPop { 0%{transform:scale(0.95);opacity:0;border-color:var(--green)} 60%{transform:scale(1.02)} 100%{transform:scale(1);opacity:1} }
    .b-time { position: absolute; top: 1.5rem; right: 1.5rem; font-family: var(--font-h); font-size: 1.25rem; color: var(--gold); }
    .b-name { font-size: 1.1rem; font-weight: 600; margin-bottom: 0.25rem; }
    .b-phone { color: var(--text-m); font-size: 0.85rem; margin-bottom: 0.5rem; display: flex; align-items: center; gap: 0.5rem; }
    .b-service { font-size: 0.8rem; color: var(--gold); background: rgba(200,164,78,0.1); display: inline-block; padding: 0.2rem 0.6rem; margin-bottom: 1rem; border: 1px solid rgba(200,164,78,0.2); }
    .b-foot { border-top: 1px solid var(--border); padding-top: 1rem; display: flex; justify-content: space-between; align-items: center; }
    .b-date-book { font-size: 0.7rem; color: var(--text-d); }

    /* Settings Form */
    .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 2rem; }
    .form-panel { background: var(--bg-card); border: 1px solid var(--border); padding: 2rem; }
    .form-panel-title { font-family: var(--font-h); font-size: 1.25rem; margin-bottom: 1.5rem; color: var(--gold); }
    .form-group { margin-bottom: 1.25rem; }
    .form-label { display: block; font-size: 0.8rem; color: var(--text-m); margin-bottom: 0.5rem; }
    .form-input { width: 100%; background: var(--bg-input); border: 1px solid var(--border); padding: 0.875rem 1rem; color: var(--text); font-size: 0.9rem; }
    .form-input:focus { border-color: var(--gold); outline: none; }
    .checkbox-lbl { display: flex; align-items: center; gap: 0.5rem; cursor: pointer; font-size: 0.85rem; }
    
    .toast { position: fixed; bottom: 2rem; right: 2rem; background: var(--bg-card); border: 1px solid var(--border); padding: 1rem 1.5rem; display: flex; align-items: center; gap: 0.75rem; z-index: 3000; transform: translateX(150%); transition: var(--tr); max-width: 320px; }
    .toast.show { transform: translateX(0); }
    .t-success { border-color: var(--green); } .t-error { border-color: var(--red); }
    
    .empty-state { text-align: center; padding: 4rem; color: var(--text-m); border: 1px dashed var(--border); }
    .loading-state { text-align: center; padding: 4rem; color: var(--text-m); }
    .loading-spinner { display: inline-block; width: 28px; height: 28px; border: 2px solid var(--border); border-top-color: var(--gold); border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 1rem; }
    @keyframes spin { to { transform: rotate(360deg); } }
    
    @media(max-width: 768px) {
      .form-grid { grid-template-columns: 1fr; }
      .header { flex-direction: column; gap: 1rem; }
    }
  </style>
</head>
<body>

<div class="login-overlay" id="login-overlay">
  <div class="login-box">
    <div class="login-title">KINGS BARBER CO<br><span style="font-size:0.6rem;letter-spacing:0.3em;color:var(--text-d)">ADMIN SECURE LOGIN</span></div>
    <input type="password" id="admin-pass" class="login-input" placeholder="••••••••" onkeyup="if(event.key==='Enter')login()">
    <button class="btn" onclick="login()">Enter Dashboard</button>
    <p id="login-err" style="color:var(--red);font-size:0.8rem;margin-top:1rem;display:none;">Incorrect password.</p>
  </div>
</div>

<div class="app" id="app">
  <header class="header">
    <div class="brand">KINGS BARBER CO <span style="font-size:0.6rem;color:var(--text-m)">ADMIN</span></div>
    <div class="nav-tabs">
      <button class="tab active" onclick="switchTab('bookings', this)">Bookings</button>
      <button class="tab" onclick="switchTab('settings', this)">Settings</button>
      <a href="index.html" target="_blank" class="tab" style="text-decoration:none;">View Site ↗</a>
      <button class="tab" onclick="logout()">Logout</button>
    </div>
    <div class="rt-indicator" id="rt-indicator">
      <div class="rt-dot" id="rt-dot"></div>
      <span id="rt-label">Connecting...</span>
    </div>
  </header>

  <main class="main">
    <!-- Bookings Section -->
    <div class="section active" id="sec-bookings">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
        <h2 class="sec-title" style="margin:0;">Manage Bookings</h2>
        <button class="btn btn-outline" style="width:auto;padding:0.5rem 1.5rem;" onclick="loadData()">↻ Refresh</button>
      </div>
      
      <div class="stats-grid">
        <div class="stat-card">
          <div class="stat-val" id="stat-today">0</div>
          <div class="stat-lbl">Today's Appointments</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-upcoming">0</div>
          <div class="stat-lbl">Upcoming Total</div>
        </div>
        <div class="stat-card">
          <div class="stat-val" id="stat-total">0</div>
          <div class="stat-lbl">All Time Bookings</div>
        </div>
      </div>

      <div id="bookings-container">
        <!-- Rendered via JS -->
      </div>
    </div>

    <!-- Settings Section -->
    <div class="section" id="sec-settings">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:2rem;">
        <h2 class="sec-title" style="margin:0;">Shop Settings</h2>
        <button class="btn" style="width:auto;" onclick="saveSettings()">Save Changes</button>
      </div>

      <div class="form-grid">
        <div class="form-panel">
          <div class="form-panel-title">Business Details</div>
          <div class="form-group">
            <label class="form-label">Shop Name</label>
            <input type="text" class="form-input" id="s-name">
          </div>
          <div class="form-group">
            <label class="form-label">Address</label>
            <input type="text" class="form-input" id="s-address">
          </div>
          <div class="form-group">
            <label class="form-label">Phone</label>
            <input type="text" class="form-input" id="s-phone">
          </div>
          <div class="form-group">
            <label class="form-label">Email</label>
            <input type="text" class="form-input" id="s-email">
          </div>
          <div class="form-group">
            <label class="form-label">Admin Password</label>
            <input type="password" class="form-input" id="s-pass">
          </div>
        </div>

        <div class="form-panel">
          <div class="form-panel-title">Booking Configuration</div>
          <div class="form-grid" style="grid-template-columns:1fr 1fr; gap:1rem;">
            <div class="form-group">
              <label class="form-label">Opening Time (Hour)</label>
              <input type="number" class="form-input" id="s-open" min="0" max="23">
            </div>
            <div class="form-group">
              <label class="form-label">Closing Time (Hour)</label>
              <input type="number" class="form-input" id="s-close" min="0" max="23">
            </div>
          </div>
          <div class="form-group">
            <label class="form-label">Slot Duration (Minutes)</label>
            <select class="form-input" id="s-dur">
              <option value="15">15 Minutes</option>
              <option value="30">30 Minutes</option>
              <option value="45">45 Minutes</option>
              <option value="60">60 Minutes</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label">Max Appointments Per Slot</label>
            <input type="number" class="form-input" id="s-max" min="1" max="10">
          </div>
          
          <div class="form-panel-title" style="margin-top:2rem; font-size:1rem;">Closed Days</div>
          <div style="display:flex; flex-wrap:wrap; gap:1rem;">
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="1"> Mon</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="2"> Tue</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="3"> Wed</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="4"> Thu</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="5"> Fri</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="6"> Sat</label>
            <label class="checkbox-lbl"><input type="checkbox" class="cb-day" value="0"> Sun</label>
          </div>
        </div>
      </div>
    </div>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast">
  <span id="toast-icon"></span>
  <span id="toast-msg"></span>
</div>

<!-- Supabase JS Client -->
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
// ═══════════════════════════════════════════
// SUPABASE INIT
// ═══════════════════════════════════════════
const SUPABASE_URL = 'https://cptwqlnjcmkvrffhxzvh.supabase.co';
const SUPABASE_ANON_KEY = 'sb_publishable_yQ5T0Uc8xdp8rHL3MnyH1A_IavXkzG8';
const _supabase = supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// Legacy kvdb settings URL
const DB_URL_SETTINGS = 'https://kvdb.io/6M2L6yjedppWbHMJ6HPNcJ/settings';

const DEFAULTS = {
  shopName:'Kings Barber Co', address:'14 Grafton Street, Dublin 2, Ireland',
  phone:'+353 1 234 5678', email:'hello@kingsbarber.ie',
  openTime:9, closeTime:18, slotDuration:30, maxPerSlot:3,
  closedDays:[0], adminPass:'admin123'
};
let S = {...DEFAULTS};
let allBookings = []; // flat array of rows from Supabase
let realtimeChannel = null;

// ═══════════════════════════════════════════
// AUTH
// ═══════════════════════════════════════════
function checkAuth() {
  if (sessionStorage.getItem('bs_admin_auth') === 'true') {
    document.getElementById('login-overlay').style.display = 'none';
    document.getElementById('app').classList.add('active');
    loadData();
    startRealtime();
  }
}

function login() {
  const p = document.getElementById('admin-pass').value;
  if (p === S.adminPass) {
    sessionStorage.setItem('bs_admin_auth', 'true');
    checkAuth();
  } else {
    document.getElementById('login-err').style.display = 'block';
  }
}

function logout() {
  if (realtimeChannel) _supabase.removeChannel(realtimeChannel);
  sessionStorage.removeItem('bs_admin_auth');
  location.reload();
}

// ═══════════════════════════════════════════
// LOAD DATA FROM SUPABASE
// ═══════════════════════════════════════════
async function loadData() {
  document.getElementById('bookings-container').innerHTML = `
    <div class="loading-state">
      <div class="loading-spinner"></div>
      <p>Loading bookings...</p>
    </div>`;

  // Load settings from kvdb
  try {
    const res = await fetch(DB_URL_SETTINGS + '?t=' + Date.now());
    if (res.ok) {
      const dbS = await res.json();
      if (dbS && Object.keys(dbS).length) S = {...DEFAULTS, ...dbS};
    }
  } catch(e) { console.error('Failed to load settings:', e); }

  // Load bookings from Supabase
  try {
    const { data, error } = await _supabase
      .from('bookings')
      .select('*')
      .order('booking_date', { ascending: true })
      .order('booking_time', { ascending: true });
    if (error) throw error;
    allBookings = data || [];
  } catch(e) {
    console.error('Failed to load bookings from Supabase:', e);
    document.getElementById('bookings-container').innerHTML = `
      <div class="empty-state">⚠️ Could not load bookings. Check Supabase connection.</div>`;
    return;
  }

  renderBookings();
  populateSettings();
}

// ═══════════════════════════════════════════
// RENDER BOOKINGS
// ═══════════════════════════════════════════
function renderBookings(highlightId = null) {
  const container = document.getElementById('bookings-container');
  
  const now = new Date();
  const todayStr = now.toISOString().slice(0,10);

  let todayCount = 0, upcomingCount = 0, totalCount = allBookings.length;

  // Filter to today + future only for display, group by date
  const grouped = {};
  allBookings.forEach(row => {
    const d = row.booking_date;
    if (d < todayStr) return; // skip past dates for display
    if (d === todayStr) todayCount++;
    upcomingCount++;
    if (!grouped[d]) grouped[d] = [];
    grouped[d].push(row);
  });

  updateStats(todayCount, upcomingCount, totalCount);

  const dates = Object.keys(grouped).sort();
  if (dates.length === 0) {
    container.innerHTML = '<div class="empty-state">No upcoming bookings yet.</div>';
    return;
  }

  container.innerHTML = '';
  dates.forEach(date => {
    const rows = grouped[date].sort((a,b) => a.booking_time.localeCompare(b.booking_time));
    const isToday = date === todayStr;

    let html = `<div class="date-group">
      <div class="date-hdr">${formatDate(date)} ${isToday ? '<span style="font-size:0.7rem;background:var(--gold);color:var(--bg);padding:0.2rem 0.5rem;border-radius:4px;">TODAY</span>' : ''}</div>
      <div class="b-grid">`;

    rows.forEach(bk => {
      const t = bk.booking_time.slice(0,5);
      const bookedAt = new Date(bk.created_at).toLocaleDateString('en-GB', {day:'2-digit',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'});
      const isNew = highlightId && bk.id === highlightId;
      html += `
        <div class="b-card${isNew ? ' new-booking' : ''}" id="bcard-${bk.id}">
          <div class="b-time">${t}</div>
          <div class="b-name">${escHtml(bk.client_name)}</div>
          <div class="b-phone">📞 <a href="tel:${escHtml(bk.client_phone)}" style="color:var(--text);text-decoration:none">${escHtml(bk.client_phone)}</a></div>
          ${bk.service_name ? `<div class="b-service">✂️ ${escHtml(bk.service_name)}</div>` : ''}
          <div class="b-foot">
            <div class="b-date-book">Booked: ${bookedAt}</div>
            <button class="btn btn-outline btn-sm btn-danger" onclick="cancelBooking(${bk.id})">Cancel</button>
          </div>
        </div>`;
    });

    html += '</div></div>';
    container.innerHTML += html;
  });
}

// ═══════════════════════════════════════════
// REALTIME SUBSCRIPTION
// ═══════════════════════════════════════════
function startRealtime() {
  setRtStatus('connecting');

  realtimeChannel = _supabase
    .channel('bookings-changes')
    .on(
      'postgres_changes',
      { event: '*', schema: 'public', table: 'bookings' },
      (payload) => {
        console.log('Realtime event:', payload);

        if (payload.eventType === 'INSERT') {
          allBookings.push(payload.new);
          allBookings.sort((a,b) => {
            const da = a.booking_date + a.booking_time;
            const db = b.booking_date + b.booking_time;
            return da.localeCompare(db);
          });
          renderBookings(payload.new.id);
          showToast(`🔔 New booking: ${payload.new.client_name} — ${payload.new.booking_date} ${payload.new.booking_time.slice(0,5)}`, 'success');

        } else if (payload.eventType === 'DELETE') {
          allBookings = allBookings.filter(b => b.id !== payload.old.id);
          renderBookings();

        } else if (payload.eventType === 'UPDATE') {
          const idx = allBookings.findIndex(b => b.id === payload.new.id);
          if (idx !== -1) allBookings[idx] = payload.new;
          renderBookings();
        }
      }
    )
    .subscribe((status) => {
      console.log('Realtime status:', status);
      if (status === 'SUBSCRIBED') setRtStatus('live');
      else if (status === 'CLOSED' || status === 'CHANNEL_ERROR') setRtStatus('off');
    });
}

function setRtStatus(state) {
  const dot = document.getElementById('rt-dot');
  const lbl = document.getElementById('rt-label');
  if (state === 'live') {
    dot.className = 'rt-dot live';
    lbl.textContent = 'Live';
    lbl.style.color = 'var(--green)';
  } else if (state === 'connecting') {
    dot.className = 'rt-dot';
    dot.style.background = 'var(--orange, #f59e0b)';
    lbl.textContent = 'Connecting...';
    lbl.style.color = '';
  } else {
    dot.className = 'rt-dot';
    dot.style.background = 'var(--text-d)';
    lbl.textContent = 'Offline';
    lbl.style.color = '';
  }
}

// ═══════════════════════════════════════════
// CANCEL BOOKING
// ═══════════════════════════════════════════
async function cancelBooking(id) {
  if (!confirm('Are you sure you want to cancel this booking?')) return;
  try {
    const { error } = await _supabase.from('bookings').delete().eq('id', id);
    if (error) throw error;
    // Realtime will trigger re-render, but also update locally for speed
    allBookings = allBookings.filter(b => b.id !== id);
    renderBookings();
    showToast('Booking cancelled ✓', 'success');
  } catch(e) {
    console.error('Failed to cancel booking:', e);
    showToast('Failed to cancel booking', 'error');
  }
}

// ═══════════════════════════════════════════
// STATS
// ═══════════════════════════════════════════
function updateStats(today, upcoming, total) {
  document.getElementById('stat-today').textContent = today;
  document.getElementById('stat-upcoming').textContent = upcoming;
  document.getElementById('stat-total').textContent = total;
}

// ═══════════════════════════════════════════
// SETTINGS
// ═══════════════════════════════════════════
function populateSettings() {
  document.getElementById('s-name').value = S.shopName;
  document.getElementById('s-address').value = S.address;
  document.getElementById('s-phone').value = S.phone;
  document.getElementById('s-email').value = S.email;
  document.getElementById('s-pass').value = S.adminPass;
  document.getElementById('s-open').value = S.openTime;
  document.getElementById('s-close').value = S.closeTime;
  document.getElementById('s-dur').value = S.slotDuration;
  document.getElementById('s-max').value = S.maxPerSlot;
  document.querySelectorAll('.cb-day').forEach(cb => {
    cb.checked = S.closedDays.includes(parseInt(cb.value));
  });
}

async function saveSettings() {
  const newS = {
    shopName: document.getElementById('s-name').value,
    address: document.getElementById('s-address').value,
    phone: document.getElementById('s-phone').value,
    email: document.getElementById('s-email').value,
    adminPass: document.getElementById('s-pass').value,
    openTime: parseInt(document.getElementById('s-open').value),
    closeTime: parseInt(document.getElementById('s-close').value),
    slotDuration: parseInt(document.getElementById('s-dur').value),
    maxPerSlot: parseInt(document.getElementById('s-max').value),
    closedDays: Array.from(document.querySelectorAll('.cb-day:checked')).map(cb => parseInt(cb.value))
  };
  try {
    const res = await fetch(DB_URL_SETTINGS, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(newS)
    });
    if (res.ok) {
      S = newS;
      showToast('Settings saved successfully!', 'success');
    } else {
      showToast('Failed to save settings', 'error');
    }
  } catch(e) {
    showToast('Failed to save settings', 'error');
  }
}

// ═══════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════
function formatDate(dateStr) {
  const [y,m,d] = dateStr.split('-');
  const dt = new Date(y, m-1, d);
  const days = ['Sunday','Monday','Tuesday','Wednesday','Thursday','Friday','Saturday'];
  const months = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
  return `${days[dt.getDay()]}, ${d} ${months[dt.getMonth()]} ${y}`;
}

function escHtml(str) {
  if (!str) return '';
  return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

function switchTab(tabId, el) {
  document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
  if (el) el.classList.add('active');
  document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
  document.getElementById('sec-' + tabId).classList.add('active');
}

let toastTimer;
function showToast(msg, type='success') {
  clearTimeout(toastTimer);
  const t = document.getElementById('toast');
  document.getElementById('toast-icon').textContent = type === 'success' ? '✅' : '❌';
  document.getElementById('toast-msg').textContent = msg;
  t.className = `toast t-${type}`;
  setTimeout(() => t.classList.add('show'), 10);
  toastTimer = setTimeout(() => t.classList.remove('show'), 4000);
}
